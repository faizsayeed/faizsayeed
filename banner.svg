<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f0f0f"/><stop offset="0.5" stop-color="#252525"/><stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect x="-300" width="300" height="220" fill="url(#shine)">
    <animate attributeName="x" from="-300" to="1000" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Mohd Faiz Sayeed
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="150" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" fill="#d0d0d0">AI &amp; Data Science  |  Machine Learning  |  Full-Stack Development
    <animate attributeName="opacity" from="0" to="1" dur="2s" fill="freeze"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
